<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CPT Analyser</title>
<style>
:root{
  --bg:#f4f6f8; --panel:#ffffff; --ink:#1b1f24; --muted:#5f6873; --line:#d9dee4; --line2:#eceff3;
  --accent:#0b62c4; --accent-ink:#ffffff; --hover:#eaf1fb; --sel:#dce9fa; --warn:#a15c00; --ok:#1f7a3d; --shadow:0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121519; --panel:#1b1f25; --ink:#e6e9ed; --muted:#99a2ad; --line:#2d333b; --line2:#252a31;
    --accent:#4c9bff; --accent-ink:#06121f; --hover:#222932; --sel:#1f3350; --warn:#e2a54a; --ok:#5cc985; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#121519; --panel:#1b1f25; --ink:#e6e9ed; --muted:#99a2ad; --line:#2d333b; --line2:#252a31;
  --accent:#4c9bff; --accent-ink:#06121f; --hover:#222932; --sel:#1f3350; --warn:#e2a54a; --ok:#5cc985; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;margin-right:8px;letter-spacing:.2px}
.btn{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:2px 7px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:default}
.status{color:var(--muted);margin-left:auto;font-size:12px;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu{position:relative}
.menu-pop{position:absolute;top:calc(100% + 4px);left:0;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.15);padding:4px;min-width:250px}
.menu-pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:5px;cursor:pointer}
.menu-pop button:hover{background:var(--hover)}
.menu-pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.langsel{padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.app{display:grid;grid-template-columns:220px 1fr;height:calc(100% - 47px)}
.side{background:var(--panel);border-right:1px solid var(--line);overflow:auto}
.side-h{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 6px;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
#list{list-style:none;margin:0;padding:0 6px 10px}
#list li{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;cursor:pointer}
#list li:hover{background:var(--hover)}
#list li.on{background:var(--sel);font-weight:600}
#list li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list li .x{opacity:.5;border:0;background:none;cursor:pointer;padding:0 3px}
#list li .x:hover{opacity:1}
#list li .dp{color:var(--muted);font-size:11px;font-weight:400}
#list li .tag{font-size:10px;font-weight:600;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto}
.tabs button{border:0;background:none;padding:7px 12px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
#view{flex:1;overflow:auto;min-height:0}
.graph{display:grid;grid-template-columns:1fr 340px;height:100%;min-height:0}
.gcol{display:flex;flex-direction:column;min-height:0;min-width:0}
.pnav{display:flex;align-items:center;gap:6px;padding:8px 16px 0;flex-wrap:wrap}
.pnav .sp{flex:1}
.page-wrap{overflow:auto;padding:12px 16px 16px;display:flex;justify-content:center;align-items:flex-start;flex:1;min-height:0}
.page-wrap svg{background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.18);height:auto;cursor:crosshair;user-select:none;flex:none}
.ctrl{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:10px 12px 30px}
.ctrl h3,.pane h3{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:14px 0 6px}
.ctrl h3:first-child{margin-top:2px}
.row{display:flex;align-items:center;gap:6px;margin:4px 0;flex-wrap:wrap}
.row label{color:var(--muted);min-width:84px}
.row input[type=number],.row input[type=text],.row select{padding:3px 6px;border:1px solid var(--line);border-radius:5px;background:var(--panel);min-width:0}
.row input[type=number]{width:74px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:none;padding:3px 10px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
table.sig{width:100%;border-collapse:collapse;font-size:12px}
table.sig td{padding:2px 2px;border-bottom:1px solid var(--line2)}
table.sig input[type=number]{width:48px;padding:1px 3px;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
table.sig select{padding:0 2px;border:1px solid var(--line);border-radius:4px;background:var(--panel);font-size:11px}
table.sig .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
table.sig button{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:0 4px;cursor:pointer;font-size:11px;line-height:16px}
table.sig tr.off td{opacity:.55}
.legend{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;font-size:12px;align-items:center}
.legend .sw{width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.15)}
.pane{padding:16px 20px;max-width:1200px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3:first-child{margin-top:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:4px 24px}
.fld{display:grid;grid-template-columns:150px 1fr auto;gap:8px;align-items:center;padding:3px 0}
.fld label{color:var(--muted);display:flex;align-items:center;gap:6px}
.fld input[type=checkbox]{width:auto;margin:0;flex:none}
.fld input:not([type=checkbox]),.fld select{padding:4px 7px;border:1px solid var(--line);border-radius:5px;background:var(--panel);width:100%;min-width:0}
.fld .u{color:var(--muted);font-size:12px;min-width:38px}
.note{color:var(--muted);font-size:12px}
.banner{padding:8px 12px;border-radius:8px;background:var(--sel);margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tblwrap{overflow:auto;max-height:calc(100vh - 190px);border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table.data{border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
table.data th{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:5px 8px;text-align:right;white-space:nowrap;z-index:1}
table.data th small{display:block;color:var(--muted);font-weight:400}
table.data td{padding:2px 8px;text-align:right;border-bottom:1px solid var(--line2);white-space:nowrap}
table.data td.ed{background:rgba(76,155,255,.13);cursor:text}
table.data td.ed:focus{outline:2px solid var(--accent)}
table.data td.chg{color:var(--warn);font-weight:600}
table.data tr:hover td{background:var(--hover)}
table.lay{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
table.lay th,table.lay td{padding:5px 8px;border-bottom:1px solid var(--line2);text-align:right}
table.lay th{color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
table.lay td.l,table.lay th.l{text-align:left}
.empty{max-width:760px;margin:40px auto;padding:0 20px}
.empty h2{margin:0 0 6px}
.empty ul{color:var(--muted);padding-left:18px}
.chartwrap{display:grid;grid-template-columns:minmax(0,640px) 1fr;gap:16px;padding:16px}
.chartwrap svg,.cmpwrap svg,.disswrap svg{width:100%;height:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.cmpwrap{display:grid;grid-template-columns:1fr 280px;gap:16px;padding:16px}
.disswrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:16px}
.tip{position:fixed;z-index:50;pointer-events:none;background:rgba(20,24,30,.94);color:#fff;font-size:11.5px;line-height:1.35;padding:6px 8px;border-radius:6px;font-variant-numeric:tabular-nums;white-space:pre}
.drop{position:fixed;inset:0;z-index:60;background:rgba(11,98,196,.15);border:3px dashed var(--accent);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;color:var(--accent)}
.modal-bg{position:fixed;inset:0;z-index:70;background:rgba(10,14,20,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(460px,100%);padding:18px 20px}
.modal h2{margin:0 0 10px;font-size:17px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.chk{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0}
.chk label{display:flex;gap:5px;align-items:center}
.eq{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
table.meth{border-collapse:collapse;width:100%;font-size:12.5px}
table.meth td,table.meth th{padding:5px 8px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}
table.meth th{color:var(--muted)}
.help h2{font-size:16px;margin:18px 0 6px}
.help p,.help li{max-width:820px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-variant-numeric:tabular-nums}
.kv b{font-weight:600}
#print{display:none}
[hidden]{display:none!important}
.view-only{display:none}
.viewonly .view-only{display:inline-flex}
.viewonly .edit-only{display:none!important}
.viewonly table.data td.ed{cursor:default}
.viewonly #view input[readonly]{background:transparent;border-color:var(--line2)}
.badge{align-items:center;padding:2px 9px;border-radius:999px;background:var(--sel);color:var(--accent);font-size:12px;font-weight:600}
@media (max-width:860px){
  .app{grid-template-columns:1fr;height:auto}
  .side{border-right:0;border-bottom:1px solid var(--line);max-height:180px}
  .graph,.cmpwrap,.disswrap,.chartwrap{grid-template-columns:1fr;height:auto}
  .ctrl{border-left:0;border-top:1px solid var(--line)}
  .status{max-width:100%;margin-left:0;flex-basis:100%}
}
@media print{
  body{background:#fff}
  body>*:not(#print){display:none!important}
  #print{display:block;color:#000}
  #print svg{display:block;page-break-after:always;break-after:page}
  #print table{border-collapse:collapse;font:7.5pt Arial,sans-serif;width:100%}
  #print th,#print td{border-bottom:0.5pt solid #ccc;padding:1pt 3pt;text-align:right;white-space:nowrap}
  #print thead td{text-align:left;border:0;font-size:9pt;padding-bottom:4pt}
  #print .pdata{page-break-after:always;break-after:page}
}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">CPT Analyser</div>
  <span class="badge view-only" data-t="View only">View only</span>
  <div class="menu edit-only">
    <button class="btn" id="bFile"><span data-t="File">File</span> ▾</button>
    <div class="menu-pop" id="filePop" hidden>
      <button data-f="new" data-t="New CPT…">New CPT…</button>
      <button data-f="open" data-t="Open files…">Open files…</button>
      <button data-f="folder" data-t="Open folder…">Open folder…</button>
      <button data-f="projects" data-t="Projects…">Projects…</button>
      <hr>
      <button data-f="save" data-t="Save GEF – current CPT">Save GEF – current CPT</button>
      <button data-f="saveall" data-t="Save GEF – all open CPTs (zip)">Save GEF – all open CPTs (zip)</button>
      <hr>
      <button data-f="closeall" data-t="Close all">Close all</button>
    </div>
  </div>
  <label class="btn primary edit-only"><span data-t="Open files">Open files</span><input type="file" id="fOpen" multiple hidden></label>
  <label class="btn edit-only"><span data-t="Open folder">Open folder</span><input type="file" id="fDir" webkitdirectory multiple hidden></label>
  <div class="menu">
    <button class="btn" id="bExport"><span data-t="Export">Export</span> ▾</button>
    <div class="menu-pop" id="exportPop" hidden>
      <button data-x="csv" data-t="Data CSV – current CPT">Data CSV – current CPT</button>
      <button data-x="csvall" data-t="Data CSV – all open CPTs (one file)">Data CSV – all open CPTs (one file)</button>
      <button data-x="csvzip" data-t="Data CSV – all open CPTs (zip, one per CPT)">Data CSV – all open CPTs (zip, one per CPT)</button>
      <button data-x="layers" data-t="Layer summary CSV – all">Layer summary CSV – all</button>
      <hr>
      <button data-x="xlsx" data-t="Excel – current CPT">Excel – current CPT</button>
      <button data-x="xlsxall" data-t="Excel – all open CPTs (zip)">Excel – all open CPTs (zip)</button>
      <hr class="edit-only">
      <button class="edit-only" data-x="gef" data-t="GEF file – current CPT">GEF file – current CPT</button>
      <button class="edit-only" data-x="gefall" data-t="GEF files – all open CPTs (zip)">GEF files – all open CPTs (zip)</button>
      <hr>
      <button data-x="png" data-t="Plot PNG – current page">Plot PNG – current page</button>
      <button data-x="jpg" data-t="Plot JPG – current page">Plot JPG – current page</button>
      <button data-x="svg" data-t="Plot SVG – current page">Plot SVG – current page</button>
      <button data-x="dxf" data-t="Plot DXF – current page">Plot DXF – current page</button>
      <hr class="edit-only">
      <button class="edit-only" data-x="html" data-t="View-only HTML – all open CPTs">View-only HTML – all open CPTs</button>
    </div>
  </div>
  <div class="menu">
    <button class="btn" id="bPrint"><span data-t="Print / PDF">Print / PDF</span> ▾</button>
    <div class="menu-pop" id="printPop" hidden>
      <button data-p="one" data-t="Plot – current CPT (all pages)">Plot – current CPT (all pages)</button>
      <button data-p="all" data-t="Plot – all open CPTs">Plot – all open CPTs</button>
      <button data-p="data" data-t="Data table – current CPT">Data table – current CPT</button>
      <button data-p="cmp" data-t="Compare view">Compare view</button>
    </div>
  </div>
  <select class="langsel" id="lang" title="Language">
    <option value="en">English</option><option value="nl">Nederlands</option><option value="de">Deutsch</option><option value="custom">Custom…</option>
  </select>
  <span class="status" id="status"></span>
</header>
<div class="app">
  <aside class="side">
    <div class="side-h"><span><span data-t="Open CPTs">Open CPTs</span> <span id="cnt"></span></span><button class="btn small edit-only" id="bCloseAll" data-t="Close all">Close all</button></div>
    <ul id="list"></ul>
  </aside>
  <main>
    <nav class="tabs" id="tabs">
      <button data-tab="graph" data-t="Graph">Graph</button>
      <button data-tab="chart" data-t="SBT chart">SBT chart</button>
      <button data-tab="layers" data-t="Layers">Layers</button>
      <button data-tab="data" data-t="Data">Data</button>
      <button data-tab="header" data-t="Header">Header</button>
      <button data-tab="compare" data-t="Compare">Compare</button>
      <button class="edit-only" data-tab="projects" data-t="Projects">Projects</button>
      <button data-tab="factors" data-t="Settings / factors">Settings / factors</button>
      <button data-tab="methods" data-t="Equations">Equations</button>
      <button class="edit-only" data-tab="help" data-t="Help">Help</button>
    </nav>
    <section id="view"></section>
  </main>
</div>
<input type="file" id="fSettings" accept=".json" hidden>
<input type="file" id="fLang" accept=".txt,.json" hidden>
<input type="file" id="fScan" webkitdirectory multiple hidden>
<div id="tip" class="tip" hidden></div>
<div id="drop" class="drop" hidden></div>
<div id="modal" class="modal-bg" hidden></div>
<div id="print"></div>

<script>
'use strict';
/* =========================================================================
   CPT Analyser – single-file CPT viewer / interpreter.
   Workflow follows CPTask's documented functions: GEF / GME / Excel / CSV
   input, new CPTs, projects, fs shift, inclination depth correction, spike
   filter, derived parameters, international (multi-page) and Dutch plots,
   dissipation tests, exports, printing, per-CPT settings and translations.
   ========================================================================= */

const PA = 100;                 // atmospheric pressure, kPa
const LS_KEY = 'cpt-analyser.v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fin = v => typeof v === 'number' && isFinite(v);
const log10 = Math.log10;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- View-only copy (Export ▸ View-only HTML) ----------
   The page as loaded, before anything is rendered, is the template for the export.
   A view-only copy carries its CPTs and settings in <script id="cpta-view">; NaN is
   stored as null inside arrays. */
const APP_HTML = '<!doctype html>\n' + document.documentElement.outerHTML;
const VIEW = (() => {
  const el = document.getElementById('cpta-view'); if (!el) return null;
  try { return JSON.parse(el.textContent, function(k, v){ return v === null && Array.isArray(this) ? NaN : v; }); } catch (e) { return null; }
})();

/* ---------- Translations ---------- */
const I18N = {nl: {}, de: {}};   // filled further down
let CUSTOM = {};
function t(s){ const L = S.lang; if (L === 'en') return s; const d = L === 'custom' ? CUSTOM : I18N[L]; return (d && d[s]) || s; }

/* ---------- Soil behaviour type zones (Robertson 1990) ---------- */
const ZONES = [
  {n:'Not classified', s:'n/a', c:'#ffffff'},
  {n:'Sensitive, fine grained', s:'Sensitive', c:'#c94f3d'},
  {n:'Organic soils – peat', s:'Organic', c:'#7b4a2a'},
  {n:'Clays – silty clay to clay', s:'Clay', c:'#4f7cac'},
  {n:'Silt mixtures – clayey silt to silty clay', s:'Silt mix', c:'#5aa6a0'},
  {n:'Sand mixtures – silty sand to sandy silt', s:'Sand mix', c:'#9cc96b'},
  {n:'Sands – clean sand to silty sand', s:'Sand', c:'#efcc55'},
  {n:'Gravelly sand to dense sand', s:'Gravelly sand', c:'#e58e37'},
  {n:'Very stiff sand to clayey sand', s:'V. stiff sand', c:'#a3a3a3'},
  {n:'Very stiff, fine grained', s:'V. stiff fine', c:'#5e5e5e'},
];

/* ---------- Signal catalogue (extra file columns are registered at load) ---------- */
const SIG = {
  qc:  {name:'Cone resistance', sym:'qc', unit:'MPa', col:'#1d4ed8', def:[0,30]},
  fs:  {name:'Sleeve friction', sym:'fs', unit:'MPa', col:'#c0262d', def:[0,0.3]},
  u2:  {name:'Pore pressure (selected filter, u0 dashed)', sym:'u', unit:'MPa', col:'#0f766e', def:[-0.1,1]},
  u1:  {name:'Pore pressure u1 (cone face)', sym:'u1', unit:'MPa', col:'#0d9488', def:[-0.1,1]},
  u3:  {name:'Pore pressure u3 (behind sleeve)', sym:'u3', unit:'MPa', col:'#115e59', def:[-0.1,1]},
  Rf:  {name:'Friction ratio', sym:'Rf', unit:'%', col:'#7c3aed', def:[0,10]},
  I:   {name:'Inclination', sym:'I', unit:'°', col:'#6b7280', def:[0,10]},
  v:   {name:'Penetration rate', sym:'v', unit:'cm/s', col:'#6b7280', def:[0,4]},
  qt:  {name:'Corrected cone resistance', sym:'qt', unit:'MPa', col:'#1e3a8a', def:[0,30]},
  qn:  {name:'Net cone resistance', sym:'qn', unit:'MPa', col:'#1e40af', def:[0,30]},
  qe:  {name:'Effective cone resistance', sym:'qe', unit:'MPa', col:'#3b5bdb', def:[0,30]},
  du:  {name:'Excess pore pressure', sym:'Δu', unit:'MPa', col:'#0e7490', def:[-0.2,1]},
  Bq:  {name:'Pore pressure ratio', sym:'Bq', unit:'-', col:'#0f766e', def:[-0.2,1]},
  uqc: {name:'Pore pressure ratio u/qc', sym:'u/qc', unit:'-', col:'#0f766e', def:[-0.2,1]},
  Qt:  {name:'Normalised cone resistance', sym:'Qt', unit:'-', col:'#1d4ed8', def:[1,1000], log:true},
  Fr:  {name:'Normalised friction ratio', sym:'Fr', unit:'%', col:'#7c3aed', def:[0.1,10], log:true},
  Ic:  {name:'Soil behaviour type index (1990)', sym:'Ic', unit:'-', col:'#111827', def:[1,4]},
  Icn: {name:'SBT index Ic (2009, Qtn)', sym:'Ic,n', unit:'-', col:'#374151', def:[1,4]},
  Qtn: {name:'Normalised cone resistance (2009)', sym:'Qtn', unit:'-', col:'#1d4ed8', def:[1,1000], log:true},
  gam: {name:'Unit weight', sym:'γ', unit:'kN/m³', col:'#6b7280', def:[12,22]},

const BASE_KEYS = Object.keys(SIG);

const EXTRA_COLS = ['#7a5c2e','#4d7c0f','#a21caf','#0369a1','#b91c1c','#57534e'];
function registerExtra(key, name, unit, vals){
  if (!SIG[key]){
    const f = vals.filter(fin); let lo = f.length ? Math.min(...f) : 0, hi = f.length ? Math.max(...f) : 1;
    if (hi <= lo) hi = lo + 1;
    const st = niceStep(hi - lo, 4); lo = Math.floor(lo / st) * st; hi = Math.ceil(hi / st) * st;
    SIG[key] = {name, sym:name, unit, col: EXTRA_COLS[(sigKeys().length - BASE_KEYS.length) % EXTRA_COLS.length], def:[lo, hi], extra:true};
  }

}

const state = { cpts: [], cur: -1, tab: 'graph', drag: null, page: 0, zoom: 1, cmp: {mode:'tile', sig:'qc', ids:null}, proj: {dir:null, rows:null, src:null, srcRows:null, files:null} };

/* =========================================================================
   Parsing
   ========================================================================= */
const blankHeader = () => ({testId:'', project:'', jobNo:'', client:'', location:'', coneType:'', date:'', remarks:'',
  x:null, y:null, gl:null, gwl:null, predrill:0, alpha:null, beta:null, sleeve:null, coneArea:null});
function num(v){ if (v === null || v === undefined || v === '') return NaN; const n = typeof v === 'number' ? v : parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : NaN; }
const optNum = v => { const n = num(v); return isFinite(n) ? n : null; };
const baseName = s => String(s).replace(/^.*[\\/]/, '').replace(/\.[^.]+$/, '');
const emptyRaw = () => ({L:[], qc:[], fs:[], u1:[], u2:[], u3:[], I:[], t:[], zc:null, x:{}});

function gefHeader(text){
  const lines = text.split(/\r?\n/); const H = {}; let i = 0;
  for (; i < lines.length; i++){
    const m = lines[i].match(/^\s*#\s*([A-Za-z0-9_]+)\s*=\s*(.*)$/);
    if (m){ const k = m[1].toUpperCase(); (H[k] = H[k] || []).push(m[2].trim()); if (k === 'EOH'){ i++; break; } }
  }
  return {H, lines, i};
}
const parts = v => v.split(',').map(s => s.trim());
function gefCommonHeader(H, fname){
  const MT = {}, MV = {};
  (H.MEASUREMENTTEXT || []).forEach(v => { const p = parts(v); MT[+p[0]] = p.length > 2 ? p.slice(1, -1).join(', ') : (p[1] || ''); });
  (H.MEASUREMENTVAR || []).forEach(v => { const p = parts(v); MV[+p[0]] = num(p[1]); });
  const h = blankHeader();
  h.testId = (H.TESTID || [''])[0] || baseName(fname);
  h.jobNo = (H.PROJECTID || [''])[0].split(',')[0].trim();
  h.project = MT[2] || (H.PROJECTNAME || [''])[0] || h.jobNo;
  h.client = MT[1] || ''; h.location = MT[3] || ''; h.coneType = MT[4] || '';
  h.remarks = [MT[20], MT[21], MT[22], MT[23]].filter(Boolean).join('; ');
  if (H.STARTDATE){ const p = parts(H.STARTDATE[0]).map(Number); if (p.length >= 3) h.date = `${p[0]}-${String(p[1]).padStart(2,'0')}-${String(p[2]).padStart(2,'0')}`; }
  if (H.XYID){ const p = parts(H.XYID[0]); h.x = optNum(p[1]); h.y = optNum(p[2]); }
  if (H.ZID){ const p = parts(H.ZID[0]); h.gl = optNum(p[1]); }
  if (fin(MV[1])) h.coneArea = MV[1];
  if (fin(MV[3])) h.alpha = MV[3];
  if (fin(MV[4])) h.beta = MV[4];
  if (fin(MV[5])) h.sleeve = MV[5] / 1000;
  if (fin(MV[13])) h.predrill = MV[13];
  if (fin(MV[14])) h.gwl = Math.abs(MV[14]);   // CPTask writes water level as negative metres below ground
  return {h, MT, MV};
}
function parseGEF(text, fname){
  const {H, lines, i: i0} = gefHeader(text);
  if (!H.EOH) throw new Error(t('No #EOH= found – not a GEF file'));
  const report = ((H.REPORTCODE || [''])[0] + ' ' + (H.PROCEDURECODE || [''])[0]).toUpperCase();
  if (/DISS/.test((H.REPORTCODE || [''])[0].toUpperCase()) || (/DISS/.test(report) && !/CPT-REPORT/.test((H.REPORTCODE || [''])[0].toUpperCase()))) return parseDISS(H, lines, i0, fname);
  let i = i0;
  const headerLines = lines.slice(0, i);
  const cols = [];
  (H.COLUMNINFO || []).forEach(v => { const p = parts(v); cols[+p[0]-1] = {unit:p[1]||'', name:p[2]||'', q:+p[3]}; });
  const voids = {};
  (H.COLUMNVOID || []).forEach(v => { const p = parts(v); voids[+p[0]-1] = +p[1]; });
  const colSep = H.COLUMNSEPARATOR ? H.COLUMNSEPARATOR[0] : null;
  const recSep = H.RECORDSEPARATOR ? H.RECORDSEPARATOR[0] : null;
  const tok = [], dataLines = [];
  for (; i < lines.length; i++){
    let ln = lines[i].trim();
    if (!ln) continue;
    if (recSep && ln.endsWith(recSep)) ln = ln.slice(0, -recSep.length).trim();
    const tt = colSep ? ln.split(colSep).map(s => s.trim()) : ln.split(/\s+/);
    if (tt.length < 2) continue;
    tok.push(tt); dataLines.push(lines[i]);
  }
  const val = (row, ci) => { if (ci == null) return NaN; const v = num(row[ci]); if (!fin(v)) return NaN; if (voids[ci] != null && Math.abs(v - voids[ci]) < 1e-6) return NaN; return v; };
  const byQ = q => cols.findIndex(c => c && c.q === q);
  const byName = re => cols.findIndex(c => c && re.test(c.name));
  const pick = (...c) => { for (const x of c) if (x >= 0) return x; return null; };
  const map = {
    L: pick(byQ(1), byName(/length|depth/i), 0),
    qc: pick(byQ(2), byName(/^qc$|cone res/i)),
    fs: pick(byQ(3), byName(/^fs$|sleeve|local fric/i)),
    u1: pick(byQ(5), byName(/^u1$/i)), u2: pick(byQ(6), byName(/^u2?$/i)), u3: pick(byQ(7), byName(/^u3$/i)),
    I: pick(byQ(8)), Ix: pick(byQ(9)), Iy: pick(byQ(10)),
    zc: pick(byQ(11)), t: pick(byQ(12)),
    Qst: pick(byName(/total friction|^qst$/i)), Qtot: pick(byName(/total force|^qt\b.*kn|^qtot/i))
  };

  const scale = {};
  for (const k of ['qc','fs','u1','u2','u3']) scale[k] = map[k] != null && /kpa/i.test(cols[map[k]].unit) ? 1e-3 : 1;

  const used = new Set(Object.values(map).filter(v => v != null));
  const derivedQ = new Set([4, 13, 14, 15, 16, 17, 18, 19, 20]);
  const extras = [];
  cols.forEach((c, ci) => { if (c && !used.has(ci) && !derivedQ.has(c.q)) extras.push({ci, key: 'x_' + c.name.replace(/\W+/g, '_').toLowerCase().slice(0, 24), name: c.name, unit: c.unit}); });

  const raw = emptyRaw(); const rowIdx = [];
  if (map.Qst != null) raw.x.Qst = []; if (map.Qtot != null) raw.x.Qtot = [];
  extras.forEach(e => raw.x[e.key] = []);
  tok.forEach((row, ri) => {
    const L = val(row, map.L); if (!fin(L)) return;
    rowIdx.push(ri);
    raw.L.push(L);
    for (const k of ['qc','fs','u1','u2','u3']) raw[k].push(val(row, map[k]) * scale[k]);
    let I = val(row, map.I);
    if (!fin(I) && map.Ix != null && map.Iy != null){
      const a = val(row, map.Ix) * Math.PI/180, b = val(row, map.Iy) * Math.PI/180;
      I = Math.acos(Math.cos(a) * Math.cos(b)) * 180/Math.PI;
    }
    raw.I.push(I); raw.t.push(val(row, map.t));
    (raw.zc = raw.zc || []).push(val(row, map.zc));
    if (map.Qst != null) raw.x.Qst.push(val(row, map.Qst));
    if (map.Qtot != null) raw.x.Qtot.push(val(row, map.Qtot));
    extras.forEach(e => raw.x[e.key].push(val(row, e.ci)));
  });
  if (!raw.zc || !raw.zc.some(fin)) raw.zc = null;
  extras.forEach(e => { map[e.key] = e.ci; registerExtra(e.key, e.name, e.unit, raw.x[e.key]); });
  const {h} = gefCommonHeader(H, fname);
  return makeCPT(fname, h, raw, {headerLines, tok, dataLines, rowIdx, map, scale, colSep, recSep, voids, h0: {...h}}, 'gef');
}

/* GEF-DISS-Report: pore pressure dissipation test */
function parseDISS(H, lines, i, fname){
  const cols = [];
  (H.COLUMNINFO || []).forEach(v => { const p = parts(v); cols[+p[0]-1] = {unit:p[1]||'', name:p[2]||'', q:+p[3]}; });
  const voids = {}; (H.COLUMNVOID || []).forEach(v => { const p = parts(v); voids[+p[0]-1] = +p[1]; });
  const fi = (test) => cols.findIndex(test);
  const ct = fi(c => c && (/time/i.test(c.name) || /^s(ec)?$/i.test(c.unit)));
  const cu = fi(c => c && ([5, 6, 7].includes(c.q) || /pore|^u/i.test(c.name)));
  const cq = fi(c => c && (c.q === 2 || /cone|^qc/i.test(c.name)));
  const T = [], U = [], Q = [];
  for (; i < lines.length; i++){
    const tt = lines[i].trim().replace(/!$/, '').split(/[\s;]+/); if (tt.length < 2) continue;
    const g = ci => { if (ci < 0) return NaN; const v = num(tt[ci]); return fin(v) && !(voids[ci] != null && Math.abs(v - voids[ci]) < 1e-6) ? v : NaN; };
    const tv = g(ct); if (!fin(tv)) continue;
    const us = cu >= 0 && /kpa/i.test(cols[cu].unit) ? 1e-3 : 1;
    T.push(tv); U.push(g(cu) * us); Q.push(g(cq));
  }
  if (!T.length) throw new Error(t('No dissipation data found'));
  const {h} = gefCommonHeader(H, fname);
  let depth = null, parent = '';
  if (H.PARENT){ const p = parts(H.PARENT[0]); parent = p[0]; depth = optNum(p[1]); }
  const uq = cu >= 0 ? cols[cu].q : 6;
  const loc = uq === 5 ? 'u1' : uq === 7 ? 'u3' : 'u2';
  const c = makeCPT(fname, h, emptyRaw(), null, 'diss');
  c.kind = 'diss';
  c.diss = {t: T, u: U, qc: Q, depth, parent, loc, opt: {u0Own: null, uiOwn: null, Ir: 100, T50: loc === 'u1' ? 0.118 : 0.245, pct: 70, axis: 'log', showQc: true}};
  if (depth != null && !/@/.test(h.testId)) h.testId = `${baseName(parent || fname)} D${h.testId} @${depth} m`;
  return c;
}

/* GME (Geomil raw format): header *.0xx + data *.1xx with calibration factors */
function parseGME(htxt, dtxt, name){
  const kv = {};
  htxt.split(/\r?\n/).forEach(l => { const m = l.match(/^\s*([^:]+?)\s*:(.*)$/); if (m && !(m[1].toLowerCase() in kv)) kv[m[1].toLowerCase()] = m[2].trim(); });
  const cal = [1, 2, 3, 4].map(n => { const m = htxt.match(new RegExp('Cal Factor\\.\\s*' + n + '\\s*:\\s*([-\\d.E+]+)', 'i')); return m ? num(m[1]) : NaN; });
  if (!fin(cal[0])) throw new Error(t('GME header without calibration factors'));
  const nCh = +(kv['nr channels'] || 3);
  const pre = num(kv['pre drill']) || 0;
  const rows = dtxt.split(/\r?\n/).map(l => l.trim().replace(/^\||\|$/g, '')).filter(Boolean).map(l => l.split('|').map(Number));
  if (!rows.length) throw new Error(t('GME data file is empty'));
  const raw = emptyRaw(); raw.zc = null;
  const nf = rows[0].length, i0 = rows[0][nf - 4];
  // subtraction cone (type S): channel 2 carries tip + sleeve load; standard sleeve area = 15 × tip area
  const subtraction = /^s/i.test(kv['conetype'] || '');
  for (const r of rows){
    if (r.length !== nf || !r.every(isFinite)) continue;
    raw.L.push(+(pre + (r[nf - 4] - i0) * 0.01).toFixed(4));
    const qc = r[0] * cal[0] / 10;
    raw.qc.push(qc);
    raw.fs.push(nCh >= 2 ? r[1] * cal[1] / 10 - (subtraction ? qc / 15 : 0) : NaN);
    raw.u2.push(nCh >= 3 ? r[2] * cal[2] / 100 : NaN);
    raw.u1.push(NaN); raw.u3.push(NaN); raw.I.push(NaN);
    raw.t.push(r[nf - 2] + r[nf - 1] / 100);
  }
  const h = blankHeader();
  h.project = kv['client name'] || ''; h.jobNo = kv['job number'] || ''; h.coneType = kv['conenumber'] || '';
  h.location = kv['location'] || ''; h.testId = kv['testnumber'] || baseName(name); h.predrill = pre;
  h.gl = optNum(kv['ground level']);
  const dm = (kv['date'] || '').match(/(\d+)-(\d+)-(\d{4})/); if (dm) h.date = `${dm[3]}-${dm[2].padStart(2,'0')}-${dm[1].padStart(2,'0')}`;
  if (subtraction) h._warn = t('Subtraction cone (type S): fs conversion not verified');
  h.remarks = t('Converted from GME raw data; inclination channels are not converted');
  return makeCPT(name, h, raw, null, 'gme');
}

/* Column mapping for CSV / Excel imports (CPTask Excel order: length, qc, fs, u, I, Qst, Qt) */
function mapHeaderCols(hdr){
  const H = hdr.map(s => String(s ?? '').toLowerCase());
  const find = (re, not) => H.findIndex(h => re.test(h) && !(not && not.test(h)));
  const m = {
    L: find(/depth|length|penetr|^z\b/),
    qc: find(/\bqc\b|cone res/, /qt|net|corr/),
    fs: find(/\bfs\b|sleeve|local fric/, /ratio|rf/),
    u1: find(/\bu1\b/), u3: find(/\bu3\b/),
    u2: find(/\bu2?\b|pore|dynamic/, /u0|u1|u3|excess|ratio|\/qc/),
    I: find(/incl/),
    Qst: find(/qst|total fric/), Qtot: find(/total force|\bqt\b.*kn|qtot/)
  };
  const kpa = k => m[k] >= 0 && /kpa/.test(H[m[k]]) ? 1e-3 : 1;
  return {m, sc: {qc: kpa('qc'), fs: kpa('fs'), u1: kpa('u1'), u2: kpa('u2'), u3: kpa('u3')}};
}
function rowsToCPT(rows, fname, h, source){
  let hi = rows.findIndex(r => r.some(c => typeof c === 'string' && /[a-z]/i.test(c) && !fin(num(c))));
  const firstNum = rows.findIndex(r => fin(num(r[0])) && fin(num(r[1])));
  if (hi > firstNum) hi = -1;
  let m = {L:0, qc:1, fs:2, u2:3, I:4, Qst:5, Qtot:6, u1:-1, u3:-1}, sc = {qc:1, fs:1, u1:1, u2:1, u3:1};
  if (hi >= 0){ const r = mapHeaderCols(rows[hi]); for (const k in r.m) if (r.m[k] >= 0) m[k] = r.m[k]; else if (k !== 'L' && k !== 'qc') m[k] = -1; sc = r.sc; }
  const raw = emptyRaw(); raw.zc = null;
  const nc = Math.max(...rows.slice(Math.max(hi + 1, firstNum)).map(r => r.length));
  if (m.Qst >= nc) m.Qst = -1; if (m.Qtot >= nc) m.Qtot = -1;
  if (m.Qst >= 0) raw.x.Qst = []; if (m.Qtot >= 0) raw.x.Qtot = [];
  for (let i = Math.max(hi + 1, firstNum); i < rows.length; i++){
    const r = rows[i]; const L = num(r[m.L]); if (!fin(L)) continue;
    raw.L.push(L);
    raw.qc.push(num(r[m.qc]) * sc.qc);
    for (const k of ['fs','u1','u2','u3']) raw[k].push(m[k] >= 0 ? num(r[m[k]]) * sc[k] : NaN);
    raw.I.push(m.I >= 0 ? num(r[m.I]) : NaN);
    raw.t.push(NaN);
    if (m.Qst >= 0) raw.x.Qst.push(num(r[m.Qst]));
    if (m.Qtot >= 0) raw.x.Qtot.push(num(r[m.Qtot]));
  }
  if (!raw.L.length) throw new Error(t('No numeric depth / qc rows found'));
  for (const k of ['Qst','Qtot']) if (raw.x[k] && !raw.x[k].some(fin)) delete raw.x[k];
  if (!h.testId) h.testId = baseName(fname);
  return makeCPT(fname, h, raw, null, source);
}
function parseDelimited(text, fname){
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  const sample = lines.slice(0, 30).join('\n');
  const cnt = c => (sample.match(new RegExp(c === '\t' ? '\t' : '\\' + c, 'g')) || []).length;
  // same non-zero number of ';' on (nearly) every line → ';' separated, even with decimal commas (1,25;3,40;…)
  const semis = lines.slice(0, 30).map(l => l.split(';').length - 1);
  const evenSemi = semis.some(c => c > 0 && semis.filter(d => d === c).length >= 0.9 * semis.length);
  const sep = cnt('\t') > 20 ? '\t' : evenSemi || cnt(';') > cnt(',') ? ';' : cnt(',') > 20 ? ',' : /\s+/;
  const rows = lines.map(l => l.split(sep).map(s => s.trim().replace(/^"|"$/g, '')));
  return rowsToCPT(rows, fname, blankHeader(), 'csv');
}
function loadXLSXLib(){
  if (window.XLSX) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = res; s.onerror = () => rej(new Error(t('Excel reader could not be loaded (no internet?). Save the sheet as CSV and open that instead.')));
    document.head.appendChild(s);
  });
}
async function parseXLSX(buf, fname){

  const rows = XLSX.utils.sheet_to_json(wb.Sheets[dn], {header:1, raw:true, defval:''});
  const h = blankHeader();
  const hn = wb.SheetNames.find(n => /header/i.test(n));

  let p8 = ''; for (let F = 1.5; F <= 10; F *= 1.01){ const x = F - 1, den = 0.005 * x - 0.0003 * x * x - 0.002; if (den <= 0) continue; const Q = 1 / den; if (Q > 1000) continue; p8 += (p8 ? 'L' : 'M') + X(F).toFixed(1) + ' ' + Y(Q).toFixed(1); }

  const xf = v => lg ? (v > 0 ? (log10(v) - log10(tmin)) / (log10(tmax) - log10(tmin)) : NaN) : (o.axis === 'sqrt' ? Math.sqrt(Math.max(v, 0)) / Math.sqrt(tmax) : v / tmax);
  const X = v => m.l + xf(v) * (W - m.l - m.r);
  const uk = D.u.map(v => v * 1000), us = uk.filter(fin).concat([R.u0 * 1000, R.ui * 1000]);
  let ulo = Math.min(...us, 0), uhi = Math.max(...us);
  const st = niceStep(uhi - ulo || 1, 6); ulo = Math.floor(ulo / st) * st; uhi = Math.ceil(uhi / st) * st;
  const Y = v => H - m.b - (v - ulo) / (uhi - ulo) * (H - m.t - m.b);
  const q = D.qc.filter(fin); const qhi = q.length ? Math.max(niceStep(Math.max(...q), 4) * 4, Math.max(...q)) : 1;
  const YQ = v => H - m.b - v / qhi * (H - m.t - m.b);
  const s = [`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" font-family="system-ui,Arial,sans-serif" font-size="12">`];
  s.push(`<clipPath id="dc"><rect x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}"/></clipPath>`);
  const xt = lg ? ticks(10 ** Math.floor(log10(tmin)), 10 ** Math.ceil(log10(tmax)), true).filter(v => v >= tmin * 0.999 && v <= tmax * 1.001) : ticks(0, o.axis === 'sqrt' ? Math.sqrt(tmax) : tmax).map(v => o.axis === 'sqrt' ? v * v : v);
  for (const v of xt) s.push(`<line x1="${X(v)}" x2="${X(v)}" y1="${m.t}" y2="${H - m.b}" stroke="currentColor" stroke-opacity=".12"/><text x="${X(v)}" y="${H - m.b + 16}" text-anchor="middle" fill="currentColor">${tickFmt(v)}</text>`);
  for (const v of ticks(ulo, uhi)) s.push(`<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="currentColor" stroke-opacity=".12"/><text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end" fill="currentColor">${tickFmt(v)}</text>`);
  const line = (y, col, lab) => s.push(`<line x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}" stroke="${col}" stroke-dasharray="5 4"/><text x="${W - m.r - 4}" y="${y - 4}" text-anchor="end" fill="${col}" font-size="11">${esc(lab)}</text>`);
  line(Y(R.u0 * 1000), '#2b6cb0', `u0 = ${fmt(R.u0 * 1000, 1)} kPa`);
  line(Y(R.ui * 1000), '#64748b', `ui = ${fmt(R.ui * 1000, 1)} kPa`);
  line(Y(R.u50 * 1000), '#d97706', `u50 = ${fmt(R.u50 * 1000, 1)} kPa`);
  for (const [tv, lab] of [[R.t50, 't50'], [R.tp, `t${o.pct}`]]) if (fin(tv) && tv > 0) s.push(`<line x1="${X(tv)}" x2="${X(tv)}" y1="${m.t}" y2="${H - m.b}" stroke="#d97706"/><text x="${X(tv) + 4}" y="${m.t + 14}" fill="#d97706" font-size="11">${lab} = ${fmt(tv, 0)} s</text>`);
  const path = (vals, Yf) => { let p = '', pen = false; D.t.forEach((tv, i) => { const x = X(tv), y = Yf(vals[i]); if (!fin(x) || !fin(y)){ pen = false; return; } p += (pen ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1); pen = true; }); return p; };
  if (o.showQc && q.length){
    s.push(`<path d="${path(D.qc, YQ)}" fill="none" stroke="#1d4ed8" stroke-width="1.2" stroke-opacity=".7" clip-path="url(#dc)"/>`);
    for (const v of ticks(0, qhi)) s.push(`<text x="${W - m.r + 6}" y="${YQ(v) + 4}" fill="#1d4ed8">${tickFmt(v)}</text>`);
    s.push(`<text transform="translate(${W - 14} ${(m.t + H - m.b) / 2}) rotate(90)" text-anchor="middle" fill="#1d4ed8">qc [MPa]</text>`);
  }
  s.push(`<path d="${path(uk, Y)}" fill="none" stroke="#0f766e" stroke-width="2" clip-path="url(#dc)"/>`);
  s.push(`<rect x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="none" stroke="currentColor" stroke-opacity=".6"/>`);
  s.push(`<text x="${(m.l + W - m.r) / 2}" y="${H - 12}" text-anchor="middle" fill="currentColor">${esc(t('Time'))} [s]${lg ? ' (log)' : o.axis === 'sqrt' ? ' (√t)' : ''}</text>`);
  s.push(`<text transform="translate(18 ${(m.t + H - m.b) / 2}) rotate(-90)" text-anchor="middle" fill="#0f766e">${D.loc} [kPa]</text>`);
  s.push('</svg>');
  return s.join('');
}

/* ---------- Compare (tile / overlay) ---------- */
const CMP_COLS = ['#1d4ed8','#c0262d','#0f766e','#7c3aed','#d97706','#0369a1','#be185d','#4d7c0f','#57534e','#0891b2'];
function cmpList(){ const all = state.cpts.filter(c => c.kind === 'cpt'); if (!state.cmp.ids) state.cmp.ids = new Set(all.slice(0, 8).map(c => c.id)); return all.filter(c => state.cmp.ids.has(c.id)); }
function compareSVG(list, forPrint){
  const k = state.cmp.sig, s = (S.scales[k] || {min:SIG[k].def[0], max:SIG[k].def[1]}), lg = s.log && s.min > 0;
  const zmax = Math.max(1, ...list.map(c => Math.max(...c.d.z.filter(fin), 0)));
  const z0 = fin(S.plot.zMin) ? S.plot.zMin : 0, z1 = fin(S.plot.zMax) ? S.plot.zMax : Math.ceil(zmax + 0.25);
  const tile = state.cmp.mode === 'tile';
  const W = forPrint ? 1120 : Math.max(700, tile ? 90 + list.length * 150 : 900), H = forPrint ? 790 : 760;
  const m = {l:56, r:18, t: tile ? 58 : 40, b: tile ? 30 : 70};
  const Y = z => m.t + (z - z0) / (z1 - z0) * (H - m.t - m.b);
  const o = [`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" font-family="Arial,sans-serif" font-size="11" ${forPrint ? 'width="297mm" height="210mm" style="background:#fff;color:#111"' : ''}>`];
  const dz = niceStep(z1 - z0, 14);
  const hgrid = (xa, xb) => { let g = ''; for (let z = Math.ceil(z0 / dz) * dz; z <= z1 + 1e-9; z += dz) g += `<line x1="${xa}" x2="${xb}" y1="${Y(z)}" y2="${Y(z)}" stroke="currentColor" stroke-opacity=".12"/>`; return g; };
  for (let z = Math.ceil(z0 / dz) * dz; z <= z1 + 1e-9; z += dz) o.push(`<text x="${m.l - 6}" y="${Y(z) + 4}" text-anchor="end" fill="currentColor">${tickFmt(+z.toFixed(6))}</text>`);
  o.push(`<text transform="translate(16 ${(m.t + H - m.b) / 2}) rotate(-90)" text-anchor="middle" fill="currentColor">${esc(t('Depth'))} [m BGL]</text>`);
  if (tile){
    const gap = 12, cw = (W - m.l - m.r - gap * (list.length - 1)) / Math.max(1, list.length), sw = 12;
    list.forEach((c, j) => {
      const xa = m.l + j * (cw + gap), tw = cw - sw - 3;
      const X = lg ? (v => v > 0 ? xa + (log10(v) - log10(s.min)) / (log10(s.max) - log10(s.min)) * tw : NaN) : (v => xa + (v - s.min) / (s.max - s.min) * tw);
      o.push(`<clipPath id="cm${j}"><rect x="${xa}" y="${m.t}" width="${tw}" height="${H - m.t - m.b}"/></clipPath>`);
      o.push(hgrid(xa, xa + tw));
      o.push(`<text x="${xa + cw / 2}" y="${m.t - 34}" text-anchor="middle" font-weight="700" fill="currentColor">${esc(c.h.testId)}</text>`);
      for (const v of ticks(s.min, s.max, lg).filter((v, i, a) => a.length <= 4 || i % 2 === 0)) o.push(`<text x="${X(v)}" y="${m.t - 6}" text-anchor="middle" font-size="9" fill="currentColor">${tickFmt(v)}</text>`);
      o.push(`<text x="${xa + tw / 2}" y="${m.t - 19}" text-anchor="middle" font-size="10" fill="${SIG[k].col}">${esc(SIG[k].sym)} [${esc(SIG[k].unit)}]</text>`);
      const d = c.d, n = d.z.length;
      o.push(`<path d="${pathOf(d.z, d[k] || [], X, Y, 0, n - 1)}" fill="none" stroke="${SIG[k].col}" stroke-width="1.1" clip-path="url(#cm${j})"/>`);
      o.push(`<rect x="${xa}" y="${m.t}" width="${tw}" height="${H - m.t - m.b}" fill="none" stroke="currentColor" stroke-opacity=".5"/>`);
      const xs = xa + tw + 3; let st = 0;
      for (let i = 0; i <= n; i++) if (i === n || d.zone[i] !== d.zone[st]){
        const zn = d.zone[st], za = clamp(d.z[st], z0, z1), zb = clamp(i < n ? d.z[i] : d.z[n-1], z0, z1);
        if (zn && zb > za) o.push(`<rect x="${xs}" y="${Y(za)}" width="${sw}" height="${Y(zb) - Y(za) + 0.3}" fill="${ZONES[zn].c}"/>`);
        st = i;
      }
      o.push(`<rect x="${xs}" y="${m.t}" width="${sw}" height="${H - m.t - m.b}" fill="none" stroke="currentColor" stroke-opacity=".5"/>`);
    });
  } else {
    const xa = m.l, tw = W - m.l - m.r;
    const X = lg ? (v => v > 0 ? xa + (log10(v) - log10(s.min)) / (log10(s.max) - log10(s.min)) * tw : NaN) : (v => xa + (v - s.min) / (s.max - s.min) * tw);
    o.push(`<clipPath id="cmo"><rect x="${xa}" y="${m.t}" width="${tw}" height="${H - m.t - m.b}"/></clipPath>`);
    o.push(hgrid(xa, xa + tw));
    for (const v of ticks(s.min, s.max, lg)) o.push(`<line x1="${X(v)}" x2="${X(v)}" y1="${m.t}" y2="${H - m.b}" stroke="currentColor" stroke-opacity=".12"/><text x="${X(v)}" y="${m.t - 8}" text-anchor="middle" fill="currentColor">${tickFmt(v)}</text>`);
    o.push(`<text x="${xa + tw / 2}" y="${m.t - 24}" text-anchor="middle" font-weight="700" fill="currentColor">${esc(SIG[k].sym)} [${esc(SIG[k].unit)}]</text>`);
    list.forEach((c, j) => { const d = c.d; o.push(`<path d="${pathOf(d.z, d[k] || [], X, Y, 0, d.z.length - 1)}" fill="none" stroke="${CMP_COLS[j % CMP_COLS.length]}" stroke-width="1.2" clip-path="url(#cmo)"/>`); });
    o.push(`<rect x="${xa}" y="${m.t}" width="${tw}" height="${H - m.t - m.b}" fill="none" stroke="currentColor" stroke-opacity=".5"/>`);
    list.forEach((c, j) => { const lx = m.l + (j % 5) * ((W - m.l - m.r) / 5), ly = H - m.b + 26 + Math.floor(j / 5) * 18; o.push(`<rect x="${lx}" y="${ly - 9}" width="18" height="4" fill="${CMP_COLS[j % CMP_COLS.length]}"/><text x="${lx + 24}" y="${ly - 3}" fill="currentColor">${esc(c.h.testId)}</text>`); });
  }
  o.push('</svg>');
  return o.join('');
}

function render(){ renderTab(); if (VIEW) lockView(); }
/* View-only copy: controls that only change how things are shown stay live; everything
   else keeps showing its value but is disabled, and pure action buttons are hidden. */
const VIEW_OK = '[data-pg],[data-zm],#bFit,[data-cmp],[data-cmpid],[data-cmpsig],[data-plot="chartColour"],[data-act="cmpAll"],[data-act="cmpNone"],[data-act="printCmp"],[data-act="printData"]';
function lockView(){
  $('#view').querySelectorAll('input,select,textarea,button').forEach(el => {
    if (el.matches(VIEW_OK)) return;
    if (el.matches('.btn,[data-mv],[data-all]')){ el.hidden = el.disabled = true; return; }
    if (el.matches('input[type=text],input[type=number],textarea')) el.readOnly = true;   // value can still be selected and copied
    else el.disabled = true;
  });
}
function renderTab(){
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
  const v = $('#view'), c = cur();
  const T = state.tab;
  if (T === 'factors'){ v.innerHTML = factorsHTML(); return; }
  if (T === 'methods'){ v.innerHTML = methodsHTML(); return; }
  if (T === 'help'){ v.innerHTML = helpHTML(); return; }
  if (T === 'projects'){ v.innerHTML = projectsHTML(); return; }
  if (T === 'compare'){ v.innerHTML = compareHTML(); return; }
  if (!c){ v.innerHTML = emptyHTML(); return; }
  if (c.kind === 'diss'){
    if (T === 'graph' || T === 'chart' || T === 'layers') v.innerHTML = dissHTML(c);
    else if (T === 'data') v.innerHTML = dissDataHTML(c);
    else if (T === 'header') v.innerHTML = headerHTML(c);
    return;
  }
  if (T === 'graph'){
    const pages = plotPages(c); state.page = clamp(state.page, 0, pages.length - 1);
    const keepScroll = $('#ctrl') ? $('#ctrl').scrollTop : 0;      // don't jump the side panel to the top on every change
    v.innerHTML =`<div class="graph"><div class="gcol"><div class="pnav">${pages.length > 1 ? `<button class="btn small" data-pg="-1">◀</button><span>${t('Page')} ${state.page + 1} / ${pages.length}</span><button class="btn small" data-pg="1">▶</button>` : ''}<span class="sp"></span><span class="note">${t('View')}</span><button class="btn small" data-zm="fit">${t('Fit')}</button><button class="btn small" data-zm="out">−25%</button><button class="btn small" data-zm="in">+25%</button></div><div class="page-wrap" id="plotWrap"></div></div><div class="ctrl" id="ctrl">${ctrlHTML()}</div></div>`;
    $('#ctrl').scrollTop = keepScroll;
    drawPlot();
  }
  else if (T === 'chart') v.innerHTML = chartHTML(c);
  else if (T === 'layers') v.innerHTML = layersHTML(c);
  else if (T === 'data') v.innerHTML = dataHTML(c);
  else if (T === 'header') v.innerHTML = headerHTML(c);
}
function drawPlot(){
  const w = $('#plotWrap'), c = cur(); if (!w || !c || c.kind !== 'cpt') return;
  w.innerHTML = plotSVG(c);
  const svg = w.querySelector('svg'); svg.removeAttribute('width'); svg.removeAttribute('height');
  const {W} = pageDims(c);
  const fitW = Math.max(200, w.clientWidth - 32);
  svg.style.width = Math.round(Math.min(W * 3.6, 1100, fitW) * state.zoom) + 'px';
}
function refresh(){ persist(); if (state.tab === 'graph') render(); else render(); }
function persist(){ saveSettings(); }

function zonePct(c, zn){ if (!c || c.kind !== 'cpt') return ''; const z = c.d.zone; const k = z.filter(v => v === zn).length; const tt = z.filter(v => v > 0).length; return tt ? Math.round(k / tt * 100) + '%' : ''; }
function scopeBanner(compact){

    ? `<div class="banner"><span>⚙ ${t('Settings apply to')} <b>${esc(c.h.testId)}</b> ${t('only')}</span><button class="btn small" data-act="useGlobal">${t('Use global settings')}</button></div>`
    : (compact ? '' : `<div class="banner"><span>${t('Settings apply to all CPTs (global).')}</span><button class="btn small" data-act="useOwn">${t('Separate settings for')} ${esc(c.h.testId)}</button></div>`);
}

function chartHTML(c){

/* Data table: raw editable columns + calculated columns */
function dataCols(c){
  const loc = c.d.uLoc || 'u2';
  const cols = [['z', t('Depth'), 'm', 2], ['L', t('Length'), 'm', 2],
    ['qc', 'qc ' + t('raw'), 'MPa', 3, true], ['fs', 'fs ' + t('raw'), 'MPa', 4, true], [loc, loc + ' ' + t('raw'), 'MPa', 4, true], ['I', 'I ' + t('raw'), '°', 2, true]];
  for (const k of Object.keys(c.raw.x)) cols.push([k, SIG[k] ? SIG[k].sym : k, SIG[k] ? SIG[k].unit : '', 3, true]);
  cols.push(['qc','qc','MPa',3], ['fs', shiftOn(c) ? t('fs shifted') : 'fs', 'MPa', 4], ['u2', loc, 'MPa', 4], ['Rf','Rf','%',2], ['qt','qt','MPa',3], ['u0','u0','MPa',4],
    ['du','Δu','MPa',4], ['uqc','u/qc','-',3], ['qe','qe','MPa',3], ['gam','γ','kN/m³',1], ['sv','σv','kPa',1], ['svp','σ\'v','kPa',1], ['qn','qn','MPa',3], ['Bq','Bq','-',3], ['Qt','Qt','-',1], ['Fr','Fr','%',2],
    ['Ic','Ic','-',2], ['zone','SBT','zone',0], ['Icn','Ic (2009)','-',2], ['Qtn','Qtn','-',1], ['DrNC','Dr NC','%',0], ['DrOC','Dr OC','%',0], ['phi','φ','°',1],
    ['Su','Su Nkmin','kPa',0], ['Su2','Su Nkmax','kPa',0], ['N60','N60','-',0], ['v','v','cm/s',2]);
  return cols;
}
function dataHTML(c){
  const d = c.d, n = d.z.length, cols = dataCols(c);
  const hd = cols.map(([k, l, u]) => `<th>${esc(l)}<small>${esc(u)}</small></th>`).join('');
  const body = [];
  for (let i = 0; i < n; i++){
    body.push('<tr>' + cols.map(([k, , , dp, ed]) => {
      if (ed){ const v = rawArr(c, k)[i]; return `<td class="ed${c.edited.has(k + ':' + i) ? ' chg' : ''}"${VIEW ? '' : ' contenteditable="true"'} data-k="${k}" data-i="${i}">${fin(v) ? v.toFixed(dp) : ''}</td>`; }
      const v = (d[k] || [])[i];
      return `<td>${k === 'zone' ? (v || '') : fmt(v, dp)}</td>`;
    }).join('') + '</tr>');
  }
  return `<div class="pane" style="max-width:none"><p class="note" style="margin-top:0">${n} ${t('rows.')} ${VIEW ? t('Shaded "raw" columns hold the measured values; highlighted values were edited before this copy was made.') : t('Shaded "raw" columns hold the measured values and can be edited: type a value, or paste a column (or block) copied from Excel into a cell to fill downwards. Everything else is recalculated. Edits are kept when saving as GEF.')}${c.edited.size ? ` <b>${c.edited.size} ${t('edited value(s).')}</b> <button class="btn small" id="bUndoEdits">${t('Undo all edits')}</button>` : ''} <button class="btn small" data-act="printData">${t('Print data')}</button></p>
  <div class="tblwrap"><table class="data"><thead><tr>${hd}</tr></thead><tbody>${body.join('')}</tbody></table></div></div>`;
}

/* Dissipation views */
function dissHTML(c){
  const D = c.diss, o = D.opt, R = c.res;
  const n = (k, l, u, v, ph) => `<div class="fld"><label>${l}</label><input type="number" step="any" data-diss="${k}" value="${v ?? ''}" placeholder="${ph ?? ''}"><span class="u">${u}</span></div>`;
  const chY = R.ch * 31557600;
  return `<div class="disswrap"><div>${dissSVG(c)}</div><div>
    <div class="card"><h3>${esc(c.h.testId)} – ${t('dissipation test')}</h3>
      <div class="kv"><span>${t('Test depth')}</span><b>${fmt(D.depth, 2)} m</b><span>${t('Parent CPT')}</span><b>${esc(D.parent || '–')}</b><span>${t('Filter location')}</span><b>${D.loc}</b>
      <span>u0</span><b>${fmt(R.u0 * 1000, 1)} kPa</b><span>ui</span><b>${fmt(R.ui * 1000, 1)} kPa</b><span>t50</span><b>${fin(R.t50) ? fmt(R.t50, 0) + ' s' : '–'}</b>
      <span>t${o.pct}</span><b>${fin(R.tp) ? fmt(R.tp, 0) + ' s' : '–'}</b><span>ch</span><b>${fin(chY) ? fmt(chY, 1) + ' m²/' + t('year') : '–'}</b><span>ch</span><b>${fin(R.ch) ? fmt(R.ch * 1e6, 3) + ' mm²/s' : '–'}</b></div>
      <p class="note">${t('ch = T* · r² · √Ir / t50 (Teh & Houlsby 1991). u0 from the water level and test depth unless entered.')}</p></div>
    <div class="card"><h3>${t('Settings')}</h3>
      ${n('u0Own', t('Own u0'), 'MPa', o.u0Own, fmt(R.u0calc, 4))}
      ${n('uiOwn', t('Own ui'), 'MPa', o.uiOwn, t('max'))}
      ${n('Ir', t('Rigidity index Ir'), '-', o.Ir)}
      ${n('T50', t('Time factor T* (50%)'), '-', o.T50)}
      ${n('pct', t('Second time line'), '%', o.pct)}
      <div class="fld"><label>${t('Time axis')}</label><select data-diss="axis">${[['log', t('Logarithmic')], ['sqrt', '√t'], ['lin', t('Linear')]].map(([v, l]) => `<option value="${v}" ${o.axis === v ? 'selected' : ''}>${l}</option>`).join('')}</select><span></span></div>
      <div class="fld"><label>${t('Plot qc')}</label><label style="color:var(--ink)"><input type="checkbox" data-diss="showQc" ${o.showQc ? 'checked' : ''}> ${t('on')}</label><span></span></div>
    </div></div></div>`;
}
function dissDataHTML(c){
  const D = c.diss;
  const rows = D.t.map((tv, i) => `<tr><td>${fmt(tv, 1)}</td><td>${fmt(D.u[i] * 1000, 2)}</td><td>${fmt(D.qc[i], 3)}</td></tr>`).join('');
  return `<div class="pane"><div class="tblwrap"><table class="data"><thead><tr><th>${t('Time')}<small>s</small></th><th>${D.loc}<small>kPa</small></th><th>qc<small>MPa</small></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

  const s = (k, l, opts) => `<div class="fld"><label>${t(l)}</label><select data-facs="${k}">${opts.map(([v, tx]) => `<option value="${v}" ${F[k] === v ? 'selected' : ''}>${t(tx)}</option>`).join('')}</select><span></span></div>`;

  return `<div class="pane">
  ${scopeBanner(false)}
  <div class="card"><h3>${t('Processing on open')}</h3><div class="grid2">
    ${s('shiftFs','Shift fs to cone depth',[['auto','Auto – raw GME files only'],['on','Always'],['off','Never']])}${n('sleeveDefault','Default cone–sleeve distance','m')}
    ${b('inclCorr','Correct depth for inclination')}${n('filterPasses','Spike filter passes','×','1')}
    ${n('filterK','Spike threshold','× noise')}${n('alphaDefault','Default area ratio α','-')}
    ${s('uLoc','Pore pressure filter location',[['auto','Auto (u2, else u1, else u3)'],['u1','u1 – cone face'],['u2','u2 – behind cone'],['u3','u3 – behind sleeve']])}
  </div><p class="note">${t('GEF files from Geomil rigs already contain fs at cone depth, so "Auto" shifts only raw GME data. Values in a file header (α, sleeve distance, water level) override the defaults for that CPT. qt is area-corrected only when u2 is used.')}</p></div>
  <div class="card"><h3>${t('Stresses')}</h3><div class="grid2">
    ${n('gwlDefault','Default water level','m BGL')}${n('gw','Unit weight of water','kN/m³')}
    ${s('gammaMethod','Soil unit weight',[['const','Constant above / below water'],['rob','Robertson & Cabal (2010) from CPT']])}
    ${n('gDry','γ above water level','kN/m³')}${n('gWet','γ below water level','kN/m³')}
  </div></div>
  <div class="card"><h3>${t('Correlations')}</h3><div class="grid2">
    ${s('drMode','Dr constants (Baldi)',[['NC','Normally consolidated'],['OC','Over-consolidated'],['custom','Custom']])}
    ${n('drC0','Dr C0','-')}${n('drC1','Dr C1','-')}${n('drC2','Dr C2','-')}
    ${n('phiA','φ factor a','-')}${n('phiB','φ factor b','-')}
    ${n('nkMin','Nk minimum','-')}${n('nkMax','Nk maximum','-')}
    ${n('icA','Ic factor a','-')}${n('icB','Ic factor b','-')}
    ${b('soilLimit','Dr/φ only for Ic<2.6, Su only for Ic≥2.6')}${n('minLayer','Minimum layer thickness','m')}
  </div></div>
  <div class="card"><h3>${t('Plot labels')}</h3><div class="grid2">${tx('company','Title block heading')}${tx('datum','Height datum label')}</div></div>
  ${VIEW ? '' : `<div class="card"><h3>${t('Settings files')}</h3>
    <div class="row"><button class="btn" data-act="setSave">${t('Save settings to file…')}</button><button class="btn" data-act="setLoad">${t('Load settings from file…')}</button><button class="btn" data-act="setDefault">${t('Save settings as default')}</button><button class="btn" id="bResetFac">${t('Reset to factory defaults')}</button></div>
    <p class="note">${t('A settings file named like a CPT (e.g. CPT-101.cptset.json) is attached to that CPT when opened together with it. Global settings are also remembered in this browser.')}</p></div>`}

function methodsHTML(){
  const r = (sym, unit, name, eq) => `<tr><td><b>${sym}</b></td><td>${unit}</td><td>${esc(t(name))}</td><td class="eq">${eq}</td></tr>`;
  const F = CC().factors;
  return `<div class="pane"><div class="card"><h3>${t('Equations used')}</h3>
  <table class="meth"><tr><th>${t('Symbol')}</th><th>${t('Unit')}</th><th>${t('Parameter')}</th><th>${t('Equation')}</th></tr>
  ${r('qc','MPa','Cone resistance','measured')}${r('fs','MPa','Sleeve friction','measured; shifted by the cone–sleeve distance for raw data')}
  ${r('u1, u2, u3','MPa','Pore pressure','measured; filter location selectable')}${r('I','°','Inclination','measured (resultant)')}
  ${r('Qst, Qt','kN','Total friction / total force (mechanical CPT)','measured')}
  ${r('z','m','Depth','z<sub>i</sub> = z<sub>i−1</sub> + ΔL · cos I')}
  ${r('Rf','%','Friction ratio','fs / qc × 100')}
  ${r('u0','MPa','Hydrostatic pore pressure','γw · (z − z<sub>w</sub>)')}
  ${r('u/qc','-','Dynamic pore pressure ratio','u / qc')}
  ${r('qt','MPa','Corrected cone resistance','qc + (1 − α) · u2')}
  ${r('Δu','MPa','Excess pore pressure','u − u0')}
  ${r('qe','MPa','Effective cone resistance','qc − u')}
  ${r('σv','kPa','Total vertical stress','Σ γ · Δz (γ above / below water, or Robertson & Cabal 2010)')}
  ${r("σ'v",'kPa','Effective vertical stress','σv − u0')}
  ${r('qn','MPa','Net cone resistance','qt − σv')}
  ${r('Bq','-','Pore pressure ratio','Δu / qn')}
  ${r('Qt','-','Normalised cone resistance','qn / σ\'v')}
  ${r('Fr','%','Normalised friction ratio','fs / qn × 100')}
  ${r('Ic','-','Soil behaviour type index','√[(a − log Qt)² + (log Fr + b)²], a = ' + F.icA + ', b = ' + F.icB)}
  ${r('SBT','zone','Soil behaviour type','Robertson (1990) chart: zone 1 and 8/9 by chart boundaries, 2–7 by Ic')}
  ${r('Qtn, Ic,n','-','Robertson (2009) normalisation','Qtn = (qn/pa)(pa/σ\'v)<sup>n</sup>, n = 0.381 Ic + 0.05 σ\'v/pa − 0.15 ≤ 1')}
  ${r('Dr','%','Relative density (Baldi et al. 1986)','1/C2 · ln[qc / (C0 · σ\'v<sup>C1</sup>)], kPa; NC: 157, 0.55, 2.41; OC: 181, 0.55, 2.61; 0–100 %')}
  ${r('φ','°','Friction angle','arctan[a + b · ln(qc / σ\'v)], a = ' + F.phiA + ', b = ' + F.phiB)}
  ${r('Su','kPa','Undrained shear strength','(qt − σv) / Nk, Nk = ' + F.nkMin + ' … ' + F.nkMax)}
  ${r('N60','-','Equivalent SPT N60 (Jefferies & Davies)','(qc / pa) / [8.5 (1 − Ic / 4.6)], pa = 100 kPa')}
  ${r('γ','kN/m³','Unit weight, Robertson & Cabal (2010)','γ/γw = 0.27 log Rf + 0.36 log(qt/pa) + 1.236')}
  ${r('v','cm/s','Penetration rate','ΔL / Δt over ±2 samples')}
  ${r('ch','m²/s','Coefficient of consolidation (dissipation)','T* · r² · √Ir / t50 (Teh & Houlsby 1991); T* = 0.245 (u2), 0.118 (u1)')}
  ${r('GME','-','Raw Geomil data conversion','qc = ch1 · cal1 / 10, fs = ch2 · cal2 / 10, u = ch3 · cal3 / 100, L = (index − 1) · 0.01 m')}
  </table>
  <p class="note">${t('Equation set, factors and processing steps follow the CPTask manual (Geomil). The GME conversion was verified against GEF files of the same tests. Correlations are indicative and should be checked against site-specific data.')}</p></div></div>`;
}

function compareHTML(){
  const all = state.cpts.filter(c => c.kind === 'cpt');
  if (!all.length) return emptyHTML();
  const list = cmpList();
  const keys = sigKeys().filter(k => all.some(c => c.d[k]));
  return `<div class="cmpwrap"><div style="overflow:auto">${list.length ? compareSVG(list) : `<p class="note">${t('Tick CPTs to compare.')}</p>`}</div><div>
    <div class="card"><h3>${t('Compare CPTs')}</h3>
      <div class="row"><span class="seg"><button data-cmp="tile" class="${state.cmp.mode === 'tile' ? 'on' : ''}">${t('Tile (side by side)')}</button><button data-cmp="overlay" class="${state.cmp.mode === 'overlay' ? 'on' : ''}">${t('Overlay')}</button></span></div>
      <div class="row"><label>${t('Signal')}</label><select data-cmpsig="1">${keys.map(k => `<option value="${k}" ${k === state.cmp.sig ? 'selected' : ''}>${esc(SIG[k].sym)} – ${esc(t(SIG[k].name))}</option>`).join('')}</select></div>
      <p class="note">${t('Uses the global scale and depth range of the Graph tab.')}</p>
      <div class="row"><button class="btn small" data-act="cmpAll">${t('All')}</button><button class="btn small" data-act="cmpNone">${t('None')}</button></div>
      ${all.map(c => `<div><label><input type="checkbox" data-cmpid="${c.id}" ${state.cmp.ids.has(c.id) ? 'checked' : ''}> ${esc(c.h.testId)}</label></div>`).join('')}
      <div class="row" style="margin-top:8px"><button class="btn" data-act="printCmp">${t('Print / PDF')}</button></div>

/* ---------- Projects (CPTask: Load project / Open project) ---------- */
const hasFSA = () => 'showDirectoryPicker' in window;
function projTable(rows, mode){
  if (!rows) return '';
  if (!rows.length) return `<p class="note">${t('No GEF or GME files found.')}</p>`;
  return `<table class="lay"><tr>${mode === 'src' ? '<th></th>' : ''}<th class="l">${t('Project no.')}</th><th>${t('GEF files')}</th><th>${t('GME files')}</th>${mode === 'src' ? '' : '<th></th>'}</tr>` +
    rows.map((r, i) => `<tr>${mode === 'src' ? `<td><input type="checkbox" data-psel="${i}" ${r.sel ? 'checked' : ''}></td>` : ''}<td class="l"><b>${esc(r.no)}</b></td><td>${r.gef.length}</td><td>${r.gme.length}</td>${mode === 'src' ? '' : `<td><button class="btn small" data-popen="${i}" data-kind="gef" ${r.gef.length ? '' : 'disabled'}>${t('Open GEF files')}</button> <button class="btn small" data-popen="${i}" data-kind="gme" ${r.gme.length ? '' : 'disabled'}>${t('Open GME files')}</button></td>`}</tr>`).join('') + '</table>';
}

async function* walkDir(dir, path = ''){
  for await (const [name, h] of dir.entries()){
    if (h.kind === 'file') yield {name, path: path + name, handle: h, dir};
    else if (!name.startsWith('.')) yield* walkDir(h, path + name + '/');
  }
}
async function projectOfFile(file, name){
  const head = await file.slice(0, 12000).text();
  if (isGME(name)){ const m = head.match(/Job Number\s*:(.*)/i); return m ? m[1].trim() : null; }
  const m = head.match(/#PROJECTID\s*=\s*([^,\r\n]*)/i); return m ? m[1].trim() : null;
}
async function scanEntries(entries){
  const byNo = {};
  for (const e of entries){
    const nm = e.name;
    const gef = /\.gef$/i.test(nm), gme = isGME(nm);
    if (!gef && !gme) continue;
    const f = e.file || await e.handle.getFile();
    let no = null;
    if (gme && /\.1[^.]*$/.test(nm)) continue;                // project number comes from the .0 header
    try { no = await projectOfFile(f, nm); } catch (err) {}
    no = no || t('(no project number)');
    const r = byNo[no] = byNo[no] || {no, gef: [], gme: [], sel: false};
    if (gef) r.gef.push(e);
    else { const m = nm.match(/^(.*)\.0([A-Za-z0-9]*)$/); const partner = m && entries.find(x => x.name === `${m[1]}.1${m[2]}` && (x.path || '').replace(/[^/]*$/, '') === (e.path || '').replace(/[^/]*$/, '')); r.gme.push(e); if (partner) r.gme.push(partner); }
  }
  return Object.values(byNo).sort((a, b) => a.no.localeCompare(b.no, undefined, {numeric:true}));
}
const IDB = {
  db(){ return new Promise((res, rej) => { const r = indexedDB.open('cpt-analyser', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k){ try { const db = await this.db(); return await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); } catch (e) { return null; } },
  async set(k, v){ try { const db = await this.db(); db.transaction('kv', 'readwrite').objectStore('kv').put(v, k); } catch (e) {} }
};
async function ensurePerm(h, mode){ const o = {mode}; if ((await h.queryPermission(o)) === 'granted') return true; return (await h.requestPermission(o)) === 'granted'; }
async function scanProjectDir(){
  const P = state.proj; if (!P.dir) return;
  if (!(await ensurePerm(P.dir, 'read'))) { setStatus(t('Permission to read the project directory was refused')); return; }
  setStatus(t('Searching projects…'));
  const entries = []; for await (const e of walkDir(P.dir)) entries.push(e);
  P.rows = await scanEntries(entries);
  setStatus(`${P.rows.length} ${t('projects found')}`); render();
}

function createNewCPT(){

  const sigs = [...document.querySelectorAll('[data-nsig]')].filter(x => x.checked).map(x => x.dataset.nsig);
  const raw = emptyRaw(); raw.zc = null;
  const n = Math.round(len / di) + 1;
  for (let i = 0; i < n; i++){
    raw.L.push(+(pre + i * di).toFixed(4));
    for (const k of ['qc','fs','u1','u2','u3','I']) raw[k].push(NaN);
    raw.t.push(NaN);
  }

  const h = blankHeader(); h.testId = $('#nId').value || 'CPT'; h.predrill = pre;

  loadGME(name, htxt, dtxt){ const c = parseGME(htxt, dtxt, name); addCPT(c); finishOpen(1, [], c); return c; },
  state, S, toGEF, excelOf, zipBytes, csvOf, plotPages, cfg
};

(async () => {
  if (VIEW) loadView();
  applyStatic(); renderList(); render();
  if (VIEW) return;
  if (hasFSA()){ const d = await IDB.get('projDir'); if (d) { state.proj.dir = d; if (state.tab === 'projects') render(); } }
})();
